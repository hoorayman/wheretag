<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WhereTag</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#007AFF;--orange:#FF9500;--green:#34C759;--red:#FF3B30;--bg:#F2F2F7;--card:#FFF;--text:#1C1C1E;--text2:#8E8E93;--border:#E5E5EA;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0}
.container{max-width:480px;margin:0 auto;padding:16px 16px 100px}
.header{position:relative;text-align:center;padding:20px 0 12px}
.header h1{font-size:22px;font-weight:700;color:var(--blue)}
.header .sub{font-size:13px;color:var(--text2);margin-top:2px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card-title{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card-title .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px;font-weight:500}
input[type=text],input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:15px;background:var(--bg);outline:none;transition:border .2s}
input:focus{border-color:var(--blue)}
.key-info{font-size:12px;color:var(--text2);margin-top:6px;word-break:break-all}
.btn{width:100%;padding:12px;border:none;border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn:active{opacity:.7}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--blue);color:#FFF}
.btn-orange{background:var(--orange);color:#FFF}
.progress{height:2px;background:var(--border);border-radius:1px;margin:10px 0;overflow:hidden;display:none}
.progress.active{display:block}
.progress::after{content:'';display:block;width:30%;height:100%;background:var(--blue);border-radius:1px;animation:slide 1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
.status{text-align:center;font-size:13px;font-weight:500;color:var(--text2);padding:10px 0;min-height:36px}
.status.error{color:var(--red)}
.report-item{border-bottom:1px solid var(--border);padding:12px 0}
.report-item:last-child{border-bottom:none}
.report-time{font-size:13px;font-weight:600;margin-bottom:4px}
.report-loc{font-size:13px;color:var(--text2);margin-bottom:8px}
.map-btns{display:flex;gap:8px;flex-wrap:wrap}
.map-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:500;text-decoration:none;color:var(--text);cursor:pointer;transition:background .2s}
.map-btn:hover{background:var(--bg)}
.hidden{display:none}
#two-fa-card .methods{margin:8px 0}
#two-fa-card .method-btn{display:inline-block;padding:6px 14px;border-radius:8px;border:1px solid var(--blue);background:var(--card);color:var(--blue);font-size:13px;font-weight:500;cursor:pointer;margin-right:6px}
#two-fa-card .method-btn.active{background:var(--blue);color:#FFF}
.empty-state{text-align:center;padding:40px 20px;color:var(--text2)}
.lang-toggle{position:absolute;top:14px;right:0;padding:4px 14px;border-radius:999px;border:1px solid var(--blue);background:transparent;color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;user-select:none;transition:background .2s,color .2s}
.lang-toggle:hover{background:var(--blue);color:#FFF}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>WhereTag</h1>
    <div class="sub" data-i18n="header_sub"></div>
    <button class="lang-toggle" id="langToggle" type="button"></button>
  </div>
  <div class="card" id="key-card">
    <div class="card-title"><span class="dot" style="background:var(--blue)"></span><span data-i18n="device_key"></span></div>
    <label data-i18n="priv_key_label"></label>
    <input type="text" id="privKey" data-i18n-placeholder="priv_key_placeholder" spellcheck="false" autocomplete="off">
    <div class="key-info" id="keyInfo"></div>
  </div>
  <div class="card" id="login-card">
    <div class="card-title"><span class="dot" style="background:var(--blue)"></span><span data-i18n="apple_id"></span></div>
    <label data-i18n="apple_id"></label>
    <input type="text" id="appleId" data-i18n-placeholder="apple_id_placeholder" autocomplete="username">
    <div style="height:10px"></div>
    <label data-i18n="password"></label>
    <input type="password" id="password" data-i18n-placeholder="password_placeholder" autocomplete="current-password">
  </div>

  <div class="progress" id="progress"></div>
  <button class="btn btn-primary" id="queryBtn" data-i18n="login_query"></button>
  <div class="card hidden" id="two-fa-card">
    <div class="card-title"><span class="dot" style="background:var(--orange)"></span><span data-i18n="two_fa_title"></span></div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:10px" data-i18n="two_fa_desc"></p>
    <div class="methods" id="methods"></div>
    <label data-i18n="verify_code_label"></label>
    <input type="text" id="twoFaCode" data-i18n-placeholder="verify_code_placeholder" inputmode="numeric" maxlength="6">
    <div style="height:10px"></div>
    <button class="btn btn-orange" id="verifyBtn" data-i18n="verify_btn"></button>
  </div>
  <div class="card hidden" id="results-card">
    <div class="card-title"><span class="dot" style="background:var(--green)"></span><span data-i18n="location_reports"></span></div>
    <div id="results"></div>
  </div>
  <div class="status" id="status" data-i18n="ready"></div>
</div>

<script>
"use strict";

// ====== State ======
var keyPair = null;
var loginState = { session_token: null, dsid: null, searchPartyToken: null };
var appState = "idle";

/* ====== i18n ====== */
var I18N = {

    no_reports_encrypted: function (n) { return "未找到可解密报告（" + n + " 条已加密）"; },
    reports_count: function (n, time) { return n + " 条报告 | 最新：" + time; },

    map_title_baidu: "在百度地图中打开",
    map_title_google: "在 Google 地图中打开"
  },
  en: {
    header_sub: "Find My Device Location Viewer",
    device_key: "Device Key",
    priv_key_label: "Private Key (56 hex chars)",
    priv_key_placeholder: "56 hex chars (28 bytes)",
    apple_id: "Apple ID",
    apple_id_placeholder: "your@email.com",
    password: "Password",
    password_placeholder: "Apple ID password",
    login_query: "Login & Query",
    two_fa_title: "Two-Factor Authentication",
    two_fa_desc: "A verification code was sent to your trusted devices.",
    verify_code_label: "Verification Code",
    verify_code_placeholder: "6-digit code",
    verify_btn: "Verify",
    location_reports: "Location Reports",
    ready: "Ready",
    need_more_chars: function (n) { return "Need " + n + " more chars"; },
    computing: "Computing...",
    error_prefix: "Error: ",
    cannot_reach_helper: "Cannot reach helper server",
    device_label: "Device: ",
    hashed_label: "Hashed",
    battery_ok: "OK",
    battery_medium: "Medium",
    battery_low: "Low",
    battery_critical: "Critical",
    battery_unknown: "Unknown",
    just_now: "just now",
    minutes_ago: function (n) { return n + "m ago"; },
    hours_ago: function (n) { return n + "h ago"; },
    days_ago: function (n) { return n + "d ago"; },
    alert_need_key: "Enter a valid 56-char hex private key",
    alert_need_credentials: "Enter Apple ID and password",
    connecting: "Connecting...",
    login_failed: "Login failed: ",
    unexpected_response: "unexpected response",
    requesting_via: "Requesting code via ",
    code_sent_to: "Code sent to ",
    requesting_code: "Requesting verification code...",
    code_sent_devices: "Verification code sent to your trusted devices",
    verifying: "Verifying...",
    twofa_failed_prefix: "2FA failed: ",
    twofa_failed_short: "2FA failed",
    twofa_error_prefix: "2FA error: ",
    fetching_reports: "Fetching reports...",
    fetch_failed: "Fetch failed: ",
    no_reports: "No reports",
    no_reports_encrypted: function (n) { return "No reports (" + n + " encrypted)"; },
    reports_count: function (n, time) { return n + " reports | Latest: " + time; },
    no_decrypted: "No decrypted reports found",
    connection_error: "Connection error: ",
    map_amap: "Amap",
    map_baidu: "Baidu",
    map_google: "Google",
    conf_label: "Conf",
    bat_label: "Bat",
    north: "N",
    south: "S",
    east: "E",
    west: "W",
    map_title_amap: "Open in Amap",
    map_title_baidu: "Open in Baidu Maps",
    map_title_google: "Open in Google Maps"
  }
};
var currentLang = localStorage.getItem("lang") === "en" ? "en" : "zh";
var lastKeyInfo = null;
var lastStatus = null;

function t(key) {
  var v = (I18N[currentLang] && I18N[currentLang][key]);
  if (v === undefined) v = I18N.en[key];
  if (typeof v === "function") {
    var args = Array.prototype.slice.call(arguments, 1);
    return v.apply(null, args);
  }
  return v === undefined ? key : v;
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem("lang", lang);
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  $("langToggle").textContent = lang === "zh" ? "EN" : "中文";
  document.querySelectorAll("[data-i18n]").forEach(function (el) {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
    el.setAttribute("placeholder", t(el.getAttribute("data-i18n-placeholder")));
  });
  if (lastKeyInfo) renderKeyInfo();
  if (lastStatus) {
    $("status").textContent = lastStatus.text;
    $("status").className = lastStatus.isError ? "status error" : "status";
  }
}

/* ====== UI ====== */
function $(id) { return document.getElementById(id); }
function show(id) { $(id).classList.remove("hidden"); }
function hide(id) { $(id).classList.add("hidden"); }

function setState(s) {
  appState = s;
  if (s === "idle") {
    $("progress").classList.remove("active");
    $("queryBtn").disabled = false;
  } else if (s === "loggingIn") {
    $("progress").classList.add("active");
    $("queryBtn").disabled = true;
    hide("two-fa-card");
    hide("results-card");
  } else if (s === "waiting2FA") {
    $("progress").classList.remove("active");
    $("queryBtn").disabled = true;
    show("two-fa-card");
  } else if (s === "fetching") {
    $("progress").classList.add("active");
    $("queryBtn").disabled = true;
    hide("two-fa-card");
  }
}

function setStatus(msg, isError) {
  lastStatus = { text: msg, isError: !!isError };
  $("status").textContent = msg;
  $("status").className = isError ? "status error" : "status";
}

var HELPER_URL = "https://1253858242-g0c7g9h5b3.ap-hongkong.tencentscf.com";

/* ====== Key Parsing (via helper) ====== */
var keyInfoCache = {};

function onKeyInput() {
  var hex = $("privKey").value.replace(/[\s\n\r\t]/g, "");
  if (hex.length !== 56) {
    keyPair = null;
    $("keyInfo").textContent = hex.length === 0 ? "" : t("need_more_chars", 56 - hex.length);
    return;
  }

  // If we already computed this key, use cached result
  if (keyInfoCache[hex]) {
    applyKeyInfo(keyInfoCache[hex]);
    return;
  }

  $("keyInfo").textContent = t("computing");
  var base = HELPER_URL;
  fetch(base + "/keyinfo?hex=" + encodeURIComponent(hex), { method: "GET" })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) { $("keyInfo").textContent = t("error_prefix") + data.error; keyPair = null; return; }
      keyInfoCache[hex] = data;
      applyKeyInfo(data);
    })
    .catch(function(e) {
      // Fallback: if helper not available, show error
      $("keyInfo").textContent = t("cannot_reach_helper") + " (" + HELPER_URL + ")";
      keyPair = null;
    });
}

function applyKeyInfo(data) {
  keyPair = {
    macAddress: function() { return data.mac; },
    hashedAdvKeyB64: function() { return data.hashedKey; },
    advKeyHex: data.advKey,
  };
  lastKeyInfo = data;
  renderKeyInfo();
}

function renderKeyInfo() {
  if (!lastKeyInfo) return;
  $("keyInfo").innerHTML = t("device_label") + lastKeyInfo.mac + "<br>" + t("hashed_label") + ": " + lastKeyInfo.hashedKeyPrefix + "...";
}

function batteryLevel(status) {
  var b = (status >> 6) & 0x03;
  var keys = ["battery_ok", "battery_medium", "battery_low", "battery_critical"];
  return keys[b] ? t(keys[b]) : t("battery_unknown");
}

function formatAge(date) {
  var diff = Date.now() - date.getTime();
  if (diff < 60000) return t("just_now");
  if (diff < 3600000) return t("minutes_ago", Math.floor(diff / 60000));
  if (diff < 86400000) return t("hours_ago", Math.floor(diff / 3600000));
  return t("days_ago", Math.floor(diff / 86400000));
}

/* ====== Login ====== */
function onQuery() {
  if (!keyPair) { alert(t("alert_need_key")); return; }
  var appleId = $("appleId").value.trim();
  var password = $("password").value;
  if (!appleId || !password) { alert(t("alert_need_credentials")); return; }

  localStorage.setItem("privKey", $("privKey").value);
  localStorage.setItem("appleId", $("appleId").value);

  setState("loggingIn");
  setStatus(t("connecting"));

  var base = HELPER_URL;
  fetch(base + "/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ apple_id: appleId, password: password })
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.error) { setState("idle"); setStatus(t("login_failed") + (data.message || data.detail || data.error), true); return; }

    if (data.status === "2fa") {
      loginState.session_token = data.session_token;
      setState("waiting2FA");
      var methodsEl = $("methods");
      methodsEl.innerHTML = "";
      (data.methods || []).forEach(function(m, i) {
        var btn = document.createElement("span");
        btn.className = "method-btn" + (i === 0 && data.methods.length === 1 ? " active" : i === 1 ? " active" : "");
        btn.textContent = m;
        btn.onclick = function() {
          methodsEl.querySelectorAll(".method-btn").forEach(function(b) { b.classList.remove("active"); });
          btn.classList.add("active");
          var base = HELPER_URL;
          setStatus(t("requesting_via") + m + "…");
          fetch(base + "/2fa/request", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_token: loginState.session_token, method: i })
          }).then(function(r) { return r.json(); }).then(function(d) {
            setStatus(d.error || t("code_sent_to") + m);
          }).catch(function(e) {
            setStatus(t("twofa_error_prefix") + e.message, true);
          });
        };
        methodsEl.appendChild(btn);
      });
      setStatus(t("requesting_code"));
      var base = HELPER_URL;
      fetch(base + "/2fa/request", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_token: loginState.session_token, method: 1 })
      }).then(function(r) { return r.json(); }).then(function(d) {
        setStatus(d.error || t("code_sent_devices"));
      }).catch(function(e) {
        setStatus(t("twofa_error_prefix") + e.message, true);
      });
      return;
    }

    if (data.status === "ok") {
      loginState.session_token = data.session_token;
      loginState.dsid = data.dsid;
      loginState.searchPartyToken = data.searchPartyToken;
      setState("fetching");
      setStatus(t("fetching_reports"));
      fetchReports();
      return;
    }

    setState("idle");
    setStatus(t("login_failed") + t("unexpected_response"), true);
  }).catch(function(e) {
    setState("idle");
    setStatus(t("connection_error") + e.message, true);
  });
}

function submit2FA() {
  var code = $("twoFaCode").value.trim();
  if (!code) return;
  setStatus(t("verifying"));

  var base = HELPER_URL;
  fetch(base + "/2fa/submit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_token: loginState.session_token, code: code })
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.error) { setState("waiting2FA"); setStatus(t("twofa_failed_prefix") + data.error, true); return; }
    if (data.status === "ok") {
      loginState.dsid = data.dsid;
      loginState.searchPartyToken = data.searchPartyToken;
      setState("fetching");
      setStatus(t("fetching_reports"));
      fetchReports();
      return;
    }
    setState("waiting2FA");
    setStatus(t("twofa_failed_short"), true);
  }).catch(function(e) {
    setState("waiting2FA");
    setStatus(t("twofa_error_prefix") + e.message, true);
  });
}

/* ====== Fetch & Decrypt ====== */
function fetchReports() {
  var base = HELPER_URL;
  fetch(base + "/fetch", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      session_token: loginState.session_token,
      dsid: loginState.dsid,
      searchPartyToken: loginState.searchPartyToken,
      hashedKey: keyPair.hashedAdvKeyB64(),
      days: 7
    })
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.error) { setState("idle"); setStatus(t("fetch_failed") + data.error, true); return; }

    var rawReports = data.results || [];
    var decrypted = [];
    var pending = rawReports.length;

    if (pending === 0) {
      renderResults([]);
      setStatus(t("no_reports"));
      setState("idle");
      return;
    }

    rawReports.forEach(function(raw) {
      var hex = $("privKey").value.replace(/[\s\n\r\t]/g, "");
      fetch(base + "/decrypt", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ hex: hex, payload: raw.payload })
      }).then(function(r) { return r.json(); }).then(function(r) {
        if (r.error) { pending--; if (pending === 0) done(); return; }
        decrypted.push({
          timestamp: new Date(r.timestamp * 1000),
          latitude: r.latitude,
          longitude: r.longitude,
          confidence: r.confidence,
          accuracy: r.accuracy,
          status: r.status
        });
        pending--;
        if (pending === 0) done();
      }).catch(function() { pending--; if (pending === 0) done(); });
    });

    function done() {
      decrypted.sort(function(a, b) { return b.timestamp.getTime() - a.timestamp.getTime(); });
      renderResults(decrypted);
      if (decrypted.length === 0) {
        setStatus(t("no_reports_encrypted", rawReports.length));
      } else {
        setStatus(t("reports_count", decrypted.length, decrypted[0].timestamp.toLocaleTimeString()));
      }
      setState("idle");
    }
  }).catch(function(e) {
    setState("idle");
    setStatus(t("fetch_failed") + e.message, true);
  });
}

function renderResults(reports) {
  var container = $("results");
  container.innerHTML = "";

  if (reports.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>' + t("no_decrypted") + '</p></div>';
    show("results-card");
    return;
  }

  reports.forEach(function(r) {
    var ns = r.latitude >= 0 ? t("north") : t("south");
    var ew = r.longitude >= 0 ? t("east") : t("west");
    var lat = Math.abs(r.latitude).toFixed(6);
    var lon = Math.abs(r.longitude).toFixed(6);

    var item = document.createElement("div");
    item.className = "report-item";
    item.innerHTML =
      '<div class="report-time">[' + formatAge(r.timestamp) + '] ' + r.timestamp.toLocaleString() + '</div>' +
      '<div class="report-loc">' + lat + ns + " " + lon + ew + " | " + t("conf_label") + ":" + r.confidence + " | " + t("bat_label") + ":" + batteryLevel(r.status) + '</div>' +
      '<div class="map-btns">' +
        '<a class="map-btn" href="https://uri.amap.com/marker?position=' + r.longitude + ',' + r.latitude + '" target="_blank" title="' + t("map_title_amap") + '">' + t("map_amap") + '</a>' +
        '<a class="map-btn" href="https://api.map.baidu.com/marker?location=' + r.latitude + ',' + r.longitude + '&title=Tracker&output=html" target="_blank" title="' + t("map_title_baidu") + '">' + t("map_baidu") + '</a>' +
        '<a class="map-btn" href="https://www.google.com/maps?q=' + r.latitude + ',' + r.longitude + '" target="_blank" title="' + t("map_title_google") + '">' + t("map_google") + '</a>' +
      '</div>';
    container.appendChild(item);
  });

  show("results-card");
}

/* ====== Init ====== */
function init() {
  $("privKey").addEventListener("input", onKeyInput);
  $("queryBtn").addEventListener("click", onQuery);
  $("verifyBtn").addEventListener("click", submit2FA);
  $("twoFaCode").addEventListener("keydown", function(e) { if (e.key === "Enter") submit2FA(); });
  $("privKey").addEventListener("input", function() { localStorage.setItem("privKey", $("privKey").value); });
  $("appleId").addEventListener("input", function() { localStorage.setItem("appleId", $("appleId").value); });
  $("langToggle").addEventListener("click", function() {
    setLang(currentLang === "zh" ? "en" : "zh");
  });

  if (localStorage.getItem("privKey")) $("privKey").value = localStorage.getItem("privKey");
  if (localStorage.getItem("appleId")) $("appleId").value = localStorage.getItem("appleId");
  if ($("privKey").value) onKeyInput();
  setLang(currentLang);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
</body>
</html>
